services:
  medivault-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8443:8443"
    environment:
      - SPRING_PROFILES_ACTIVE=production
      - HCAPTCHA_SECRET=${HCAPTCHA_SECRET}
      - LOG_SERVER_HOST=logserver
      - LOG_SERVER_PORT=5555
      - SSL_KEYSTORE_LOCATION=${SSL_KEYSTORE_LOCATION}
      - SSL_KEYSTORE_PASSWORD=${SSL_KEYSTORE_PASSWORD}
      - SSL_TRUSTSTORE_LOCATION=${SSL_TRUSTSTORE_LOCATION}
      - SSL_TRUSTSTORE_PASSWORD=${SSL_TRUSTSTORE_PASSWORD}
    depends_on:
      - logserver
    volumes:
      - ./server/demo:/app/demo
    networks:
      - medivault-network
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    environment:
      - discovery.type=single-node
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - medivault-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.1
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=${ELASTICSEARCH_USERNAME}
      - ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_PASSWORD}
      - XPACK_SECURITY_ENABLED=true
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY}
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - medivault-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  logserver:
    build:
      context: ./logs
      dockerfile: Dockerfile
    volumes:
      - ./logs/data:/app/logs
    environment:
      - AUDIT_HMAC_KEY=${AUDIT_HMAC_KEY}
      - AUDIT_LOG_FILE=/app/logs/audit.log
      - AUDIT_PORT=5555
    ports:
      - "5555:5555"
    networks:
      - medivault-network
    restart: unless-stopped

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.11.1
    user: root
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=${ELASTICSEARCH_USERNAME}
      - ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_PASSWORD}
    volumes:
      - ./logs/data:/usr/share/filebeat/logs:ro
      - ./logs/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
      logserver:
        condition: service_started
    command: ["filebeat", "-e", "-strict.perms=false"]
    networks:
      - medivault-network
    restart: unless-stopped

volumes:
  es_data:
    driver: local

networks:
  medivault-network:
    driver: bridge