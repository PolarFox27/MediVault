<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
<head>
    <meta charset="UTF-8">
    <title>MediVault – Patient Authentication</title>
    <link rel="icon" type="image/png" th:href="@{/icons/logo.png}">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <!-- Styles -->
    <style>

        /* Container */
        .auth-container {
            width: 500px;
            background: var(--background-color-1);
            border-radius: 25px;
            border: 1px solid var(--blue-2);
            box-shadow: 0 25px 50px var(--shadow-color);
            overflow: hidden;
        }

        /* Tabs */
        .tabs {
            display: flex;
            position: relative;
            background: var(--background-color-2);
        }

        .tab {
            flex: 1;
            padding: 14px;
            text-align: center;
            cursor: pointer;
            font-weight: 500;
            color: var(--blue-2);
            z-index: 1;
            font-size: 30px;
        }

        .slider {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 50%;
            height: 100%;
            background: var(--background-color-1);
            border-radius: 16px 16px 0 0;
            transition: transform 0.35s ease;
        }

        /* Forms Wrapper */
        .forms {
            display: flex;
            width: 200%;
            transition: transform 0.4s ease;
        }

        .form-panel {
            width: 50%;
            padding: 28px;
        }

        h2 {
            margin-bottom: 18px;
        }

        label {
            font-size: 20px;
            margin-bottom: 6px;
            display: block;
            color: black;
        }
    </style>
</head>

<body class="centered-container">
<a th:href="@{/}" class="btn-with-icon tooltip-button margin-50" aria-label="Back">
    <img th:src="@{/icons/back.png}" alt="Go Back" class="icon width-40">
    <span class="tooltip">Go Back</span>
</a>

<div class="auth-container">

    <!-- Tabs -->
    <div class="tabs">
        <div class="slider" id="slider"></div>
        <div class="tab" onclick="showLogin()">Login</div>
        <div class="tab" onclick="showRegister()">Register</div>
    </div>

    <!-- Forms -->
    <div class="forms" id="forms">

        <!-- Login -->
        <div class="form-panel">
            <h2>Passwordless Login</h2>
            <div id="error"></div>
            <form action="/webauthn/login/finish" method="POST" id="loginForm">
                <input type="hidden" id="credential" name="credential">
                <button type="button" onclick="checkCredentials()"
                        class="text-button text-button-1 fill-width font-20">
                    Login with Security Key
                </button>
            </form>
        </div>

        <!-- Register -->
        <div class="form-panel">
            <h2>Passwordless Registration</h2>
            <div id="errors"></div>
            <form action="/webauthn/register/start" method="POST" id="registerForm">
                <label for="credname">Security Key Name</label>
                <input type="text" id="credname" name="credname" placeholder="Blue Yubikey" required>
                <button type="submit" class="text-button text-button-1 fill-width font-20">
                    Register
                </button>
            </form>
        </div>

    </div>
</div>

<!-- Scripts -->
<script src="javascript/base64js.min.js"></script>
<script src="javascript/custom.js"></script>
<script src="javascript/login.js"></script>
<script src="javascript/registerauth.js"></script>

<script>
    const forms = document.getElementById("forms");
    const slider = document.getElementById("slider");

    function showLogin() {
        forms.style.transform = "translateX(0%)";
        slider.style.transform = "translateX(0)";
    }

    function showRegister() {
        forms.style.transform = "translateX(-50%)";
        slider.style.transform = "translateX(100%)";
    }
</script>

</body>
</html>
