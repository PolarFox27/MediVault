<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
<head>
    <meta charset="UTF-8">
    <title>MediVault – Patient Authentication</title>
    <link rel="icon" type="image/png" th:href="@{/icons/logo.png}">
    <!-- Styles -->
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Nunito', sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(180deg, #f3f9ff 0%, #e9f3fb 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1f2937;
        }

        /* Container */
        .auth-container {
            width: 500px;
            background: #d9ebff;
            border-radius: 25px;
            border: 1px solid rgba(27, 116, 228, 0.7);
            box-shadow: 0 25px 50px rgba(27, 116, 228, 0.18);
            overflow: hidden;
        }

        /* Tabs */
        .tabs {
            display: flex;
            position: relative;
            background: #abc3dc;
        }

        .tab {
            flex: 1;
            padding: 14px;
            text-align: center;
            cursor: pointer;
            font-weight: 500;
            color: #1b74e4;
            z-index: 1;
            font-size: 30px;
        }

        .slider {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 50%;
            height: 100%;
            background: #d9ebff;
            border-radius: 16px 16px 0 0;
            transition: transform 0.35s ease;
        }

        /* Forms Wrapper */
        .forms {
            display: flex;
            width: 200%;
            transition: transform 0.4s ease;
        }

        .form-panel {
            width: 50%;
            padding: 28px;
        }

        h2 {
            margin-bottom: 18px;
            font-weight: bold;
            text-align: center;
        }

        label {
            font-size: 20px;
            margin-bottom: 6px;
            display: block;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid #cfe4f6;
            outline: none;
            margin-bottom: 16px;
            background: #ffffff;
        }

        input:focus {
            border-color: #1b74e4;
        }

        button {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #1da1f2, #1b74e4);
            color: #ffffff;
            font-size: 20px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(27, 116, 228, 0.35);
        }
    </style>
</head>

<body>

<div class="auth-container">

    <!-- Tabs -->
    <div class="tabs">
        <div class="slider" id="slider"></div>
        <div class="tab" onclick="showLogin()">Login</div>
        <div class="tab" onclick="showRegister()">Register</div>
    </div>

    <!-- Forms -->
    <div class="forms" id="forms">

        <!-- Login -->
        <div class="form-panel">
            <h2>Passwordless Login</h2>
            <div id="error"></div>
            <form action="/webauthn/login/finish" method="POST" id="loginForm">
                <input type="hidden" id="credential" name="credential">
                <button type="button" onclick="checkCredentials()">Login with Security Key</button>
            </form>
        </div>

        <!-- Register -->
        <div class="form-panel">
            <h2>Passwordless Registration</h2>
            <div id="errors"></div>
            <form action="/webauthn/register/start" method="POST" id="registerForm">
                <label for="credname">Security Key Name</label>
                <input type="text" id="credname" name="credname" placeholder="Blue Yubikey" required>
                <button type="submit">Register</button>
            </form>
        </div>

    </div>
</div>

<!-- Scripts -->
<script src="javascript/base64js.min.js"></script>
<script src="javascript/custom.js"></script>
<script src="javascript/login.js"></script>
<script src="javascript/registerauth.js"></script>

<script>
    const forms = document.getElementById("forms");
    const slider = document.getElementById("slider");

    function showLogin() {
        forms.style.transform = "translateX(0%)";
        slider.style.transform = "translateX(0)";
    }

    function showRegister() {
        forms.style.transform = "translateX(-50%)";
        slider.style.transform = "translateX(100%)";
    }
</script>

</body>
</html>
