<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Dashboard - MediVault</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/doctor-dashboard.css}">
</head>
<body>
    <header>
        <div class="topbar">
            <div class="centered-container gap-15">
                <img th:src="@{/icons/logo.png}" alt="MediVault" class="width-60"/>
                <span id="topbar-doctor-name" class="font-20">Doctor Portal</span>
            </div>
            <div class="centered-container gap-15">
                <a th:href="@{/doctor/dashboard}" class="btn-with-icon tooltip-button">
                    <img th:src="@{/icons/home.png}" alt="Dashboard" class="icon width-40">
                    <span class="tooltip tooltip-bottom">Dashboard</span>
                </a>
                <a href="/logout" class="btn-with-icon tooltip-button">
                    <img th:src="@{/icons/logout.png}" alt="Logout" class="icon width-40">
                    <span class="tooltip tooltip-bottom">Logout</span>
                </a>
            </div>
        </div>
    </header>

    <main>
        <div class="dashboard-container">
            <div class="doctor-info-card" id="doctorInfo">
                <h2 id="doctorName">Loading...</h2>
                <p id="doctorOrg"></p>
                <div class="cert-badge" id="certBadge">
                    <span>Certificate Serial: </span>
                    <span id="certSerial"></span>
                </div>
            </div>

            <div id="messageArea"></div>

            <div class="section-card">
                <div class="section-title">Patients in Your Organization</div>
                <div id="patientList" class="patient-list">
                    <div class="loading">Loading patients...</div>
                </div>
            </div>

            <div class="section-card" id="fileSection" style="display: none;">
                <div class="section-title">
                    Medical Records: <span id="selectedPatientName"></span>
                </div>
                <div id="fileList" class="file-list">
                    <div class="empty-state">Select a patient to view their files</div>
                </div>
            </div>

            <div class="section-card">
                <div class="section-title">My Change Requests</div>
                <div id="changeRequestList" class="file-list">
                    <div class="loading">Loading change requests...</div>
                </div>
            </div>
        </div>
    </main>

    <div class="modal" id="changeRequestModal">
        <div class="modal-content">
            <div class="modal-title">Request Changes to Medical Record</div>
            <div class="form-group">
                <label>File: <span id="modalFileName" style="font-weight: normal;"></span></label>
            </div>
            <div class="form-group">
                <label for="changeDescription">Describe the requested changes:</label>
                <textarea id="changeDescription" placeholder="Enter your suggested changes or corrections to this medical record..."></textarea>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="submitChangeRequest()">Submit Request</button>
            </div>
        </div>
    </div>

    <script th:src="@{/javascript/doctor-dashboard.js}"></script>
</body>
</html>
