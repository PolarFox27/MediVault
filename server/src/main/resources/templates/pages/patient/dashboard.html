<div th:fragment="frag-patient-dashboard" class="main-content relative fill-width centered-container">
    <!-- Files Section -->
    <div class="files-section">
        <h3 class="section-title">My Files</h3>
        <div class="centered-container">
            <button class="text-button text-button-1 margin-top-10 margin-bottom-30 font-20 tooltip-button" onclick="openFileInput()">
                Upload New File
                <span class="tooltip">Maximum 20MB</span>
            </button>
        </div>

        <input id="uploadFileInput" type="file" hidden />
        <div class="centered-container vertical-flex fill-width" id="files-box"></div>
    </div>
</div>
