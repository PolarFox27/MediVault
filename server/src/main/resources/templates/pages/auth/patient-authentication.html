<div th:fragment="frag-patient-authentication" class="centered-container fill-width fill-height">

    <a th:href="@{/welcome}" data-client-nav class="btn-with-icon tooltip-button back-button">
        <img th:src="@{/icons/back.png}" alt="Go Back" class="icon width-60">
        <span class="tooltip">Go Back</span>
    </a>

    <div class="auth-container">
        <!-- Tabs -->
        <div class="tabs">
            <div class="slider" id="slider"></div>
            <div class="tab" onclick="showLogin()">Login</div>
            <div class="tab" onclick="showRegister()">Register</div>
        </div>

        <!-- Forms -->
        <div class="forms" id="forms">

            <!-- Login -->
            <div class="form-panel">
                <h2 class="margin-bottom-20">Passwordless Login</h2>
                <form action="/webauthn/login/finish" method="POST" id="loginForm">
                    <input type="hidden" id="credential" name="credential">
                    <input type="hidden" id="loginCaptchaToken" name="captchaToken">
                    <div id="hcaptcha-login" class="h-captcha" data-sitekey="e2cc3850-5ae4-487a-a932-570a206ccebe" data-size="invisible" data-callback="onLoginCaptcha"></div>
                    <button id="button-login" type="button" onclick="triggerLoginWithCaptcha()"
                            class="text-button text-button-1 fill-width font-20">
                        Login with Security Key
                    </button>
                </form>
            </div>

            <!-- Register -->
            <div class="form-panel">
                <h2 class="margin-bottom-20">Passwordless Registration</h2>
                <form action="/webauthn/register/start" method="POST" id="registerNewKeyForm">
                    <label for="name" class="font-20 margin-bottom-5">Full Name</label>
                    <input type="text" id="name" minlength="3" maxlength="32" name="name" placeholder="John Doe" required>
                    <label for="dob" class="font-20 margin-bottom-5">Date of Birth</label>
                    <input type="date" id="dob" name="dob" required>
                    <label for="credname" class="font-20 margin-bottom-5">Security Key Name</label>
                    <input type="text" id="credname" minlength="3" maxlength="16" name="credname" placeholder="Blue YubiKey" required>
                    <input type="hidden" id="registerCaptchaToken" name="captchaToken">
                    <div id="hcaptcha-register" class="h-captcha" data-sitekey="e2cc3850-5ae4-487a-a932-570a206ccebe" data-size="invisible" data-callback="onRegisterCaptcha"></div>
                    <button id="button-register" type="button" class="text-button text-button-1 fill-width font-20" onclick="triggerRegisterWithCaptcha()">
                        Register
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
