<div th:fragment="frag-patient-authentication" class="centered-container relative fill-width fill-height">

    <a th:href="@{/welcome}" data-client-nav class="btn-with-icon tooltip-button back-button">
        <img th:src="@{/icons/back.png}" alt="Go Back" class="icon width-60">
        <span class="tooltip">Go Back</span>
    </a>

    <div class="auth-container">
        <!-- Tabs -->
        <div class="tabs">
            <div class="slider" id="slider"></div>
            <div class="tab" onclick="showLogin()">Login</div>
            <div class="tab" onclick="showRegister()">Register</div>
        </div>

        <!-- Forms -->
        <div class="forms" id="forms">

            <!-- Login -->
            <div class="form-panel">
                <h2 class="margin-bottom-20">Passwordless Login</h2>
                <form action="/webauthn/login/finish" method="POST" id="loginForm">
                    <input type="hidden" id="credential" name="credential">
                    <button type="button" onclick="login()"
                            class="text-button text-button-1 fill-width font-20">
                        Login with Security Key
                    </button>
                </form>
            </div>

            <!-- Register -->
            <div class="form-panel">
                <h2 class="margin-bottom-20">Passwordless Registration</h2>
                <form action="/webauthn/register/start" method="POST" id="registerForm">
                    <label for="credname" class="font-20 margin-bottom-5">Security Key Name</label>
                    <input type="text" id="credname" minlength="3" maxlength="16" name="credname" placeholder="Blue YubiKey" required>
                    <button type="button" class="text-button text-button-1 fill-width font-20" onclick="register()">
                        Register
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
