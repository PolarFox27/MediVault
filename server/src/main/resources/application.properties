spring.application.name=medivault

spring.datasource.url=jdbc:h2:file:./server/demo
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Automatically create/drop tables (good for dev)
spring.jpa.hibernate.ddl-auto=update

# WebAuthn config
authn.hostname=localhost
authn.display=Medivault
authn.origin=https://localhost:8443

# HTTPS with mTLS (Client Certificate Authentication)
# SSL configuration handled programmatically in TomcatSslConfig.java
server.port=8443

# Custom SSL paths (used by TomcatSslConfig)
ssl.keystore.location=src/main/resources/medivault.p12
ssl.keystore.password=password
ssl.keystore.alias=medivault
ssl.truststore.location=src/main/resources/pki/truststore.p12
ssl.truststore.password=changeit
ssl.client-auth=want

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# hCaptcha config
hcaptcha.secret=${HCAPTCHA_SECRET}
hcaptcha.verify-url=https://hcaptcha.com/siteverify

# Enable debug logging for hCaptcha service
logging.level.ssd.medivault.auth=DEBUG
